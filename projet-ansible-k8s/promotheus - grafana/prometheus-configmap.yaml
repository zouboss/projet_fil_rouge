apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc.cluster.local:9093']
                

    rule_files:
      - /etc/prometheus/rules/alert-rules.yaml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'backend'
        metrics_path: /api/metrics
        static_configs:
          - targets: ['backend-service.default.svc.cluster.local:8000']
          
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter.default.svc.cluster.local:9187']

